<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes App</title>

    <!-- bootstrap css  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- font awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- main css  -->
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <header>
        <div class="container">
            <div class="header-logo d-flex align-items-center justify-content-between py-4">
                <h2 id="logo">Quote's</h2>
                <ul class="d-flex ps-0 mb-0" id="list">
                    <li class="mx-4"><a href="javascript:void(0)">Home</a></li>
                    <li class="mx-4"><a href="javascript:void(0)">About</a></li>
                    <li class="mx-4"><a href="javascript:void(0)">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>
        <section class="quote-slider">
            <div class="container-fluid">
                <div class="quote-wrapper">
                    <button id="prevBtn" class="nav-btn"><i class="fas fa-chevron-left"></i> Prev</button>

                    <div id="quote-display" class="quotes">
                        <p id="quote-text">The only way to do great work is to love what you do.</p>
                        <h5 id="quote-author">Steve Jobs</h5>
                        <span id="quote-category">Inspiration</span>
                        <img id="quote-img"
                            src="https://images.unsplash.com/photo-1611224923853-80b023f02d71?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80"
                            class="rounded-circle" alt="Steve Jobs" width="120" height="120">
                    </div>

                    <button id="nextBtn" class="nav-btn">Next <i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="d-flex justify-content-center align-items-center mt-5">
                    <button class="btn btn-success mx-3" id="startBtn">Start</button>
                    <button class="btn btn-danger mx-3" id="stopBtn">Stop</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p class="mb-0 py-3">© 2023 Quote's App. All rights reserved.</p>
        </div>
    </footer>

    <!-- bootstrap js  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- main script  -->
    <script src="script.js"></script>
</body>

</html>
