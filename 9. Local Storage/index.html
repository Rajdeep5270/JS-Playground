<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ's Test</title>

    <!-- bootstrap css cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- main css  -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header></header>

    <main>
        <section class="form py-5">
            <div class="container">
                <h2 class="text-center mb-5 fw-bold text-primary">Knowledge Quiz</h2>

                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8 col-sm-12">

                        <div class="quiz-container">
                            <h3 id="question">What is the capital of France?</h3>

                            <ul>
                                <li>
                                    <label>
                                        <input type="radio" name="answer">
                                        <span>Paris</span>
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="radio" name="answer">
                                        <span>London</span>
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="radio" name="answer">
                                        <span>Rome</span>
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="radio" name="answer">
                                        <span>Berlin</span>
                                    </label>
                                </li>
                            </ul>

                            <button id="nextBtn" class="next-btn shadow-sm">Next Question</button>

                            <!-- <div class="text-center mt-3">
                                <small class="text-muted">Question 1 of 10</small>
                            </div> -->
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- bootstap js cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- main js  -->
    <script src="script.js"></script>
</body>
</body>

</html>
