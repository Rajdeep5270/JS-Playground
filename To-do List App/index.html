<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To - Do App</title>

    <!-- boostrap css cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
</head>

<body>

    <header>
        <section class="main-heading py-4">
            <h2 class="text-center">To-Do App</h2>
        </section>
    </header>

    <main>
        <!-- add to do section  -->
        <section class="to-do py-5">
            <div class="container">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Write Task Here..."
                        aria-label="Recipient’s username" aria-describedby="button-addon2" id="task">
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2">Add Task</button>
                </div>
            </div>
        </section>

        <section class="display-to-do">
            <div class="container">
                <div id="allTasks"></div>
            </div>
        </section>
    </main>

    <footer></footer>


    <!-- bootstrap js cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- main js  -->
    <script src="script.js" type="text/javascript"></script>
</body>

</html>
